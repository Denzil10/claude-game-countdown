<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Meteor Dodge</title>
<style>body{margin:0;background:#000;display:flex;justify-content:center;align-items:center;height:100vh;font-family:monospace}canvas{border:2px solid #4cf}</style>
</head><body><canvas id="c" width="480" height="640"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=480,H=640;
let k={},p,rocks,stars,score,best=+localStorage.best||0,over,t,spawn;
addEventListener('keydown',e=>{k[e.key]=1;if([' ','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();if(over&&(e.key==' '||e.key=='Enter'))reset();});
addEventListener('keyup',e=>k[e.key]=0);
function reset(){p={x:W/2,y:H-60,r:12};rocks=[];stars=[];score=0;over=false;t=0;spawn=0;}
function update(){
 if(over)return;
 t++;score++;
 const s=5;
 if(k.ArrowLeft||k.a)p.x-=s; if(k.ArrowRight||k.d)p.x+=s;
 if(k.ArrowUp||k.w)p.y-=s; if(k.ArrowDown||k.s)p.y+=s;
 p.x=Math.max(p.r,Math.min(W-p.r,p.x));p.y=Math.max(p.r,Math.min(H-p.r,p.y));
 const lvl=1+t/600;
 if(--spawn<=0){spawn=Math.max(6,30-t/100);const r=10+Math.random()*25;rocks.push({x:Math.random()*W,y:-r,r,vy:(2+Math.random()*3)*lvl,vx:(Math.random()-.5)*2});}
 if(Math.random()<.02)stars.push({x:Math.random()*(W-40)+20,y:-10});
 for(const r of rocks){r.y+=r.vy;r.x+=r.vx;if(Math.hypot(r.x-p.x,r.y-p.y)<r.r+p.r-3){over=true;if(score>best){best=score;localStorage.best=best;}}}
 rocks=rocks.filter(r=>r.y<H+50);
 for(const s of stars){s.y+=3;if(Math.hypot(s.x-p.x,s.y-p.y)<20){s.got=1;score+=500;}}
 stars=stars.filter(s=>!s.got&&s.y<H+20);
}
function draw(){
 x.fillStyle='#08081a';x.fillRect(0,0,W,H);
 for(let i=0;i<60;i++){x.fillStyle='#334';x.fillRect((i*97)%W,(i*53+t*(1+i%3))%H,2,2);}
 x.fillStyle='#fd3';for(const s of stars){x.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5,rr=i%2?5:11;x.lineTo(s.x+Math.sin(a)*rr,s.y-Math.cos(a)*rr);}x.fill();}
 for(const r of rocks){x.fillStyle='#a63';x.beginPath();x.arc(r.x,r.y,r.r,0,7);x.fill();x.fillStyle='#742';x.beginPath();x.arc(r.x-r.r/3,r.y-r.r/4,r.r/4,0,7);x.fill();}
 x.fillStyle=over?'#f44':'#4cf';x.beginPath();x.moveTo(p.x,p.y-16);x.lineTo(p.x-12,p.y+12);x.lineTo(p.x+12,p.y+12);x.fill();
 if(!over&&t%6<3){x.fillStyle='#f80';x.fillRect(p.x-4,p.y+12,8,6);}
 x.fillStyle='#fff';x.font='18px monospace';x.fillText('Score '+score,10,24);x.fillText('Best '+best,W-140,24);
 if(over){x.textAlign='center';x.font='40px monospace';x.fillText('GAME OVER',W/2,H/2-20);x.font='18px monospace';x.fillText('Space / Enter to retry',W/2,H/2+20);x.textAlign='left';}
 if(t<180&&!over){x.textAlign='center';x.fillText('Arrows/WASD: dodge meteors, grab stars',W/2,H/2);x.textAlign='left';}
}
function loop(){update();draw();requestAnimationFrame(loop);}
reset();loop();
</script></body></html>
